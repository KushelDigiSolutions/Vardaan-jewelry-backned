name: Backend Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          port: ${{ vars.PORT }}
          key: ${{ vars.SSH_KEY }}
          script: |
            set -e

            echo "===== Backend Deployment Started ====="

            cd /home/ubuntu/backend

            git fetch origin

            git checkout main

            git reset --hard origin/main

            npm ci

            pm2 reload backend --update-env

            pm2 save

            echo "===== Backend Deployment Finished ====="

      - name: Health Check
        run: |
          sleep 10
          curl -f https://admin.vardaanjewels.com/api